[package]
name = "assay"
version = "2.0.0"
edition = "2021"
description = "A Universal Verifier and Oracle Protocol for AI-Assisted Software Development"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
tempfile = "3.8"
